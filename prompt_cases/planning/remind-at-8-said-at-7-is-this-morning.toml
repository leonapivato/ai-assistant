# "remind me at 8 to call Mom", said at 7 in the morning, is a task at 08:00 local
# with no offset (ADR-0340 §3:2, §8:3, §10:5).
prompt = "planning"
guards = "local_time_misread"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn, to remind Leo to call his mother, whose at is 2026-10-29T08:00, a local time with no UTC offset, and which names no zone and no rule. It falls due this morning, not at 20:00."""

[input]
file = "remind-at-8-said-at-7-is-this-morning.json"
