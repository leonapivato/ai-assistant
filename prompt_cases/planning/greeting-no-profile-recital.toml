# The user only says good morning. The person block shows their name, how they like to be
# addressed, their zone and language, and three memories they keep in mind. Someone who
# knows them greets them back as a person would, and recites none of it (ADR-0338 §7:8,
# §11:3).
prompt = "planning"
guards = "profile_recited"
came_from = "2026-10-21"
set = "development"
samples = 2

[flags]
takes_message = true
story_calls = false
story_reads = false
approved = false
candidates = false
reliance = false
person = true
suggestions = false

[property]
check = "read"
read = """The message greets the user back, briefly, and may call them Tomás. It recites \
nothing of what the person block holds: not their full name, zone or language, not that \
they are vegetarian or live with their sister, and nothing about their preferences or how \
the assistant was told to speak to them."""

[input]
file = "greeting-no-profile-recital.json"
