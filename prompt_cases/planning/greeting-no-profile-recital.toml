# Leo only says good morning. Always in mind shows his name, how he likes to be
# addressed, his zone and language, and three memories he keeps in mind. Someone who
# knows him greets him back as a person would, and recites none of it (ADR-0338 §7:8,
# §11:3).
prompt = "planning"
guards = "profile_recited"
came_from = "2026-10-21"
set = "development"
samples = 2

[property]
check = "read"
read = """A text call greets Leo back, briefly, and may call him Leo. Its words recite nothing of what always in mind holds: not his full name, zone or language, not that he is vegetarian or that Maren is his partner, and nothing about how he likes replies or how the system was told to speak to him."""

[input]
file = "greeting-no-profile-recital.json"
