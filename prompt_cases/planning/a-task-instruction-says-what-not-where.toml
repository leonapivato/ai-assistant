# #3445, part 2: a task's instruction says what its activation is to do, and where it
# speaks is its places. An instruction that restates the place, such as "Deliver in the
# hub chat", goes stale once that place is gone, and later readers take it as where the
# task spoke.
prompt = "planning"
guards = "place_in_instruction"
came_from = "#3445"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn_task call, falling due in 3 minutes, whose connections name L1, and whose instruction says what to remind Leo of and nothing of where to say it: it names no chat, conversation, platform or place, and does not say here."""

[input]
file = "a-task-instruction-says-what-not-where.json"
