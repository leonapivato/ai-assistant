# "make it 9" for a daily task not yet said is a spawn replacing it with the same rule
# at the new time (ADR-0340 §5:3, §10:5).
prompt = "planning"
guards = "change_not_replace"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn_task call whose replaces names T1, about watering the plants, whose rule repeats daily at 21:00. It does not set a one-off for tonight in its place, and makes no cancel_task call."""

[input]
file = "make-it-nine-on-a-rule-keeps-the-rule.json"
