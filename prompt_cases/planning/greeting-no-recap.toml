# The user only says good morning. Earlier matters are in the windows, and one of them is
# still open, but the user asked about none of them: the round greets them back, and
# brings up nothing they did not ask about.
prompt = "planning"
guards = "greeting_recap"
came_from = "2026-10-21"
set = "development"
samples = 2

[flags]
takes_message = true
story_calls = false
story_reads = false
approved = false
candidates = false
reliance = false

[property]
check = "read"
read = """The message greets the user back, briefly, and recaps no earlier matter: not the \
dentist appointment, not the train times, not the gift, nor anything the user did not ask \
about in this input."""

[[input.messages]]
role = "user"
content = '''
{
  "now": "2026-04-09T08:03:00+01:00",
  "time_zone": "Europe/London",
  "place": {
    "takes_message": true,
    "description": "a Telegram chat with the user"
  },
  "understanding": {
    "meaning": "The user greets the assistant with a good morning.",
    "ground": "stated"
  },
  "place_window": [
    {
      "from": "the user",
      "at": "2026-04-06T19:12:00+01:00",
      "text": "can you check train times to Hollin Bay for Saturday",
      "episode": "E1"
    },
    {
      "from": "the assistant",
      "at": "2026-04-06T19:12:30+01:00",
      "text": "There is an 8:12 and a 10:40 from Marlow Cross on Saturday. Want me to look at fares?",
      "episode": "E1"
    },
    {
      "from": "the user",
      "at": "2026-04-07T21:40:00+01:00",
      "text": "remind me I need to get something for Ines's birthday",
      "episode": "E2"
    },
    {
      "from": "the assistant",
      "at": "2026-04-07T21:40:20+01:00",
      "text": "Got it, I'll keep Ines's birthday in mind.",
      "episode": "E2"
    },
    {
      "from": "the user",
      "at": "2026-04-09T08:03:00+01:00",
      "is_the_input": true,
      "text": "good morning!"
    }
  ],
  "episode_window": [
    {
      "episode": "E3",
      "at": "2026-04-05T10:00:00+01:00",
      "understood": "The user asks the assistant to note a dentist appointment on Friday 10 April at 15:00."
    },
    {
      "episode": "E1",
      "at": "2026-04-06T19:12:00+01:00",
      "understood": "The user asks for train times to Hollin Bay on Saturday."
    },
    {
      "episode": "E2",
      "at": "2026-04-07T21:40:00+01:00",
      "understood": "The user asks to be reminded to buy a birthday present for Ines."
    }
  ],
  "recalled": "missing: nothing was recalled for this input",
  "capabilities": ["web_search"],
  "rounds": [],
  "evidence": []
}'''

[[input.tools]]
name = "web_search"
description = "Search the web. Say what you are looking for, and what you need from the results."

[input.tools.parameters]
type = "object"
required = ["query", "looking_for"]

[input.tools.parameters.properties.query]
type = "string"
description = "The search terms."

[input.tools.parameters.properties.looking_for]
type = "string"
description = "What you need from the results."
