# ADR-0350 §13:4, §9:4: "make it 9" for a reminder not yet said is a spawn replacing it.
# The round before listed Leo's tasks, so the reminder is shown under its T label;
# there is no change capability, and a cancel then a new spawn is not the one step.
prompt = "planning"
guards = "change_not_replace"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn whose replaces names T1, the reminder to water the balcony plants, falling due at 21:00 Lisbon time today (a local time with no offset, 2026-10-29T21:00, or the same instant with its offset). It makes no cancel_task call."""

[input]
file = "make-it-nine-replaces.json"
