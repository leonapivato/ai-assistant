# Round 1 proposed the booking Leo asked for, and it came back needing his yes,
# offered for asking as 1.1. This round asks him: a text call asks the question and names
# the call in its asks, so the system shows its exact details after his words. A text call
# saying the booking waits for his yes, with no call named in asks, asks nothing.
prompt = "planning"
guards = "yes_without_question"
came_from = "#3104"
set = "development"
samples = 3

[property]
check = "asks_about"
calls = ["1.1"]

[input]
file = "asks-for-booking-yes.json"
