# Round 1 proposed the booking the user asked for, and it came back needing their yes,
# offered for asking as 1.1. This round asks them: it writes the question as its message
# and names the call in asks, so the system shows its exact details below the message. A
# message saying the booking waits for their yes, with no call named in asks, asks nothing.
prompt = "planning"
guards = "yes_without_question"
came_from = "#3104"
set = "development"
samples = 3

[flags]
takes_message = true
story_calls = false
story_reads = false
approved = false
candidates = false
reliance = false
person = false
suggestions = false
spawn = false
scheduled = false

[property]
check = "asks_about"
calls = ["1.1"]

[input]
file = "asks-for-booking-yes.json"
