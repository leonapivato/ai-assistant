# The mirror of `greeting-no-recap-as-asked`: the same earlier matters, one of them due
# tomorrow, but Leo said he likes a short rundown of what's coming up when he says good
# morning, kept as a style memory (ADR-0338 §5). The prompts hold no greeting rule, so his
# stated preference governs: the round greets him back and, briefly, brings up what is due
# soon, and recites nothing of always in mind (ADR-0338 §7:8).
prompt = "planning"
guards = "preference_ignored"
came_from = "2026-10-21"
set = "development"
samples = 2

[property]
check = "read"
read = """A send_text call greets Leo back, may call him Leo, and, because he said he likes a short rundown of what's coming up when he says good morning, briefly brings up what is due soon: at least the dentist appointment tomorrow, Friday 30 October at 10:30, and it may mention Saturday's trains or the gift for Ines. It recites nothing of always in mind: not his zone or language, and it does not say that it knows or was told that he likes a rundown."""

[input]
file = "greeting-rundown-as-asked.json"
