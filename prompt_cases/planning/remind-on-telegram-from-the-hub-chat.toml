# ADR-0350 §13:4, §5:6: "remind me on Telegram at 8", set on the hub chat, suggests the
# line's chat from the place list, which shows it under its own label beside this
# conversation.
prompt = "planning"
guards = "suggested_place_ignored"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes a spawn to remind Leo to call his mum about Sunday, falling due at 20:00 Lisbon time today (a local time with no offset, 2026-10-29T20:00, or the same instant with its offset), whose places name L2, the Telegram chat. It does not suggest only L1, the hub chat's conversation."""

[input]
file = "remind-on-telegram-from-the-hub-chat.json"
