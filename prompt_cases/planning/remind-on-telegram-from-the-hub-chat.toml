# ADR-0350 §13:4, §5:6: "remind me on Telegram at 8", set on the hub chat, suggests the
# line's chat from the place list, which shows it under its own label beside this
# conversation.
prompt = "planning"
guards = "suggested_place_ignored"
came_from = "2026-10-25"
set = "development"
samples = 2

[flags]
takes_message = true
story_calls = false
story_reads = false
approved = false
candidates = false
reliance = false
person = false
suggestions = false
spawn = true
scheduled = false
running_work = false
offers = false
waiting = false
earlier_work = false

[property]
check = "read"
read = """The round proposes a spawn to remind them to call their mum about Sunday, falling due at 20:00 London time today (a local time with no offset, 2026-06-13T20:00, or the same instant with its offset), whose places name L2, the Telegram chat. It does not suggest only L1, the hub chat's conversation."""

[input]
file = "remind-on-telegram-from-the-hub-chat.json"
