# "tomorrow at 9 instead" for a daily task is a replace from the day after tomorrow and
# a one-off task at 09:00 tomorrow, in one round (ADR-0340 §5:2, §10:5).
prompt = "planning"
guards = "skip_misread"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes two spawn_task calls: one whose replaces names T1, about the vitamin, whose rule repeats daily at 07:00 from 2026-10-31; and one with no rule and no replaces, about the vitamin, whose at is 2026-10-30T09:00. It makes no cancel_task call."""

[input]
file = "tomorrow-at-9-instead-skips-and-sets-a-one-off.json"
