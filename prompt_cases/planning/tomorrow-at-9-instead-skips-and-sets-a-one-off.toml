check = "read"
read = """The round proposes two spawns: one whose replaces names T1, about the vitamin, whose rule repeats daily at 07:00 from 2026-11-12; and one with no rule and no replaces, about the vitamin, whose at is 2026-11-11T09:00. It proposes no cancel_task call."""

[input]
file = "tomorrow-at-9-instead-skips-and-sets-a-one-off.json"
