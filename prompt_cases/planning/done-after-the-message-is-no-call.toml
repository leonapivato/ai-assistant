# "done" right after a task's message is no call: that occurrence has ended
# (ADR-0340 §5:5, §10:5).
prompt = "planning"
guards = "done_misread"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes no cancel_task and no spawn_task call. It may make one send_text call with a short acknowledgement."""

[input]
file = "done-after-the-message-is-no-call.json"
