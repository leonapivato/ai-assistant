# Leo only says good morning. Earlier matters are in his memory, and one of them is still
# open, but he asked about none of them. Whether a greeting brings up what is coming up is
# the person's taste, and the prompts hold no rule for it: what governs is a preference he
# stated, kept as a style memory (ADR-0338 §5). Leo said he doesn't want earlier things
# brought up when he only says hello, so the round greets him back and brings up none of
# them. The mirror case, `greeting-rundown-as-asked`, holds the same memory under the
# opposite preference.
prompt = "planning"
guards = "greeting_recap"
came_from = "2026-10-21"
set = "development"
samples = 2

[property]
check = "read"
read = """A text call greets Leo back, and may call him Leo. Because he said he doesn't want earlier things brought up when he only says hello, it brings up no earlier matter: not the dentist appointment, not the train times, not the gift for Ines, nor anything else he did not ask about in this stimulus. It does not say that it is leaving anything out, or that it knows or was told how he likes a greeting answered."""

[input]
file = "greeting-no-recap-as-asked.json"
