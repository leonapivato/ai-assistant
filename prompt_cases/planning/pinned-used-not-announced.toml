# Leo asks for a quick dinner idea. He pinned that he is vegetarian. Someone who
# knows him suggests a dish with no meat or fish, without saying that they know it or
# remembered it (ADR-0338 §7:8, §11:3).
prompt = "planning"
guards = "kept_in_mind_announced"
came_from = "2026-10-21"
set = "development"
samples = 2

[property]
check = "read"
read = """A send_text call suggests at least one quick dinner with no meat and no fish, and does not announce what it knows: no "since you're vegetarian", "as you've told me", "I remember" or any other line saying that it knows or kept in mind that he is vegetarian."""

[input]
file = "pinned-used-not-announced.json"
