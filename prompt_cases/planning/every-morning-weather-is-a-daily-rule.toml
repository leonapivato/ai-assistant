# "every morning at 7, check the weather and tell me" is a daily rule on a task the
# person set, whose instruction is the work (ADR-0340 §2, §4:1, §10:5).
prompt = "planning"
guards = "rule_not_set"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn_task call whose rule repeats daily at 07:00, with no zone, whose instruction is to check the weather and tell Leo. It does not look the weather up now."""

[input]
file = "every-morning-weather-is-a-daily-rule.json"
