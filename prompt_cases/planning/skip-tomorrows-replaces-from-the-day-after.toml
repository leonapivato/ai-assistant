# "skip tomorrow's" for a daily task is a spawn replacing it with the same rule, from
# the day after tomorrow (ADR-0340 §5:1, §10:5).
prompt = "planning"
guards = "skip_misread"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn_task call whose replaces names T1, about watering the plants, whose rule repeats daily at 20:00 from 2026-10-31. It makes no cancel_task call."""

[input]
file = "skip-tomorrows-replaces-from-the-day-after.json"
