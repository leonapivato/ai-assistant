# ADR-0350 §13:4, §9:3: a cancel whose words could mean either of two tasks. The round
# before listed Leo's tasks: two pending reminders, each about a call. Where the
# words could mean more than one task, planning asks which, and cancels neither.
prompt = "planning"
guards = "ambiguous_task_guessed"
came_from = "2026-10-25"
set = "development"
samples = 3

[property]
check = "read"
read = """The round makes no cancel_task call. A send_text call asks Leo which reminder he means, naming both: the call to the dentist on Tuesday and the call to the vet on Wednesday, and its words use no T label."""

[input]
file = "ambiguous-cancel-asks-which.json"
