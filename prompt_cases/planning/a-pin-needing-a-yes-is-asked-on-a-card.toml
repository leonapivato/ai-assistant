# ADR-0362 §6:4's pin, its ask: round 1 pinned the memory that Leo eats no meat, and it came
# back needing his yes and saying to ask through request_approval with the same arguments
# (ADR-0361 §2:4). This round asks on a card for that pin, naming the memory by its label.
# A code check of the arguments' text passes a request for another call whose why names
# this one, so this property is read.
prompt = "planning"
guards = "yes_without_question"
came_from = "2026-11-01"
set = "development"
samples = 3

[property]
check = "read"
read = "Calls request_approval for a pin call whose memory is M2, and asks Leo no question in words about it."

[input]
file = "a-pin-needing-a-yes-is-asked-on-a-card.json"
