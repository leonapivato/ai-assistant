# ADR-0356 §11:1 case 7: a reminder coming due is a stimulus from the system itself,
# handled as what it was set up to do: a text to Leo to call his mother.
prompt = "planning"
guards = "misread_system_stimulus"
came_from = "2026-10-31"
set = "development"
samples = 3

[property]
check = "only_says"
phrases = ["mother"]

[input]
file = "reminder-coming-due-reminds.json"
