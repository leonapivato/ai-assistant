# ADR-0349 §4:6-§4:7: "never mind the booking" after the booking work has acted on the
# hub's chat. Concurrent stimuli show that work running and having acted, so this round
# acts on E1 alone: it stops it in this round, without reading it first, since the stop's
# result shows what it had done (stop_work's description, the coordinator's ruling on
# #3618). A round that only looks it up leaves the work running, and fails.
prompt = "planning"
guards = "stop_missed"
came_from = "2026-10-26"
set = "development"
samples = 2

[property]
check = "calls_within"
capabilities = ["stop_work"]
argument = "work"
value = "E1"

[input]
file = "never-mind-stops-the-work-that-acted.json"
