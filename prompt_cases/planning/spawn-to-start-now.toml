# ADR-0350 §13:4: a spawn to start now. Leo asks for research to run as separate
# work, reported back, while he keeps working with the system on something else. Every
# spawn goes through the Task Scheduler, now included (§3:2): the round spawns the research
# with no when, so it starts at once in an activation of its own, rather than doing it in
# this one.
prompt = "planning"
guards = "spawn_inline"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes a spawn_task call whose instruction is the flight research for Porto over the long weekend, with no at, delay_minutes or after, so it falls due now. It does not start the research itself in this round, and any text call it makes says the research is being looked into separately, never that anything was found."""

[input]
file = "spawn-to-start-now.json"
