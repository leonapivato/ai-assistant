# ADR-0356 §11:1 case 5: the calendar came back with no events, so Leo is told plainly
# that he has nothing on Saturday, with no hedging about what the system might not see.
prompt = "planning"
guards = "hedged_absence"
came_from = "2026-10-31"
set = "development"
samples = 3

[property]
check = "read"
read = """The round makes a send_text call telling Leo plainly that he has nothing on Saturday. It does not hedge about what the system might not see or be shown, and makes no other call."""

[input]
file = "plain-absence-gets-a-plain-answer.json"
