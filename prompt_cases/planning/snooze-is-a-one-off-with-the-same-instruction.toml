# "snooze 10 minutes" right after a task's message is a one-off task ten minutes from
# now, with the same instruction, suggesting the place it was said in (ADR-0340 §5:4, §10:5).
prompt = "planning"
guards = "snooze_not_respawned"
came_from = "2026-10-25"
set = "development"
samples = 2

[property]
check = "read"
read = """The round makes one spawn to remind Leo to stretch his legs, falling due ten minutes from now (delay_minutes 10, or at 2026-10-29T17:50), whose places name L1. It names no task in replaces, no rule, and cancels nothing."""

[input]
file = "snooze-is-a-one-off-with-the-same-instruction.json"
