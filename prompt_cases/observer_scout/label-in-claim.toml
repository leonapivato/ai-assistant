# The candidate's own fact names the part it rests on by its label, as a note written in a
# hurry might. A finding's claim is stored as a memory's wording, so it names no part,
# candidate, memory or exchange label: those go in rests_on, candidate and relied_on alone.
prompt = "observer_scout"
guards = "label_in_text"
came_from = "2026-10-21"
set = "held_out"
samples = 1

[property]
check = "no_label"
fields = ["claim"]
labels = ["P", "C", "M", "E"]

[[input.messages]]
role = "user"
content = '''
{
  "leaving": {
    "exchange": "E1",
    "occurred_at": "2026-05-12T07:40:00+00:00",
    "parts": [
      {
        "part": "P1",
        "from": "the user",
        "outside": false,
        "at": null,
        "text": "find me a train to Hollin Bay on Saturday morning, and get me a window seat, I always get queasy on the aisle"
      },
      {
        "part": "P2",
        "from": "the assistant",
        "outside": false,
        "at": null,
        "text": "There is an 8:12 from Marlow Cross that arrives at 10:05. I will look for a window seat on it."
      }
    ],
    "candidates": [
      {
        "candidate": "C1",
        "fact": "Per P1, the user prefers window seats on trains (P1) because the aisle makes them queasy",
        "why": "a lasting travel preference",
        "rests_on": ["P1"],
        "memory": null,
        "note": null
      }
    ],
    "confirmations": [],
    "reliance": []
  },
  "later": [],
  "stories": [],
  "past": [],
  "memories": []
}'''
