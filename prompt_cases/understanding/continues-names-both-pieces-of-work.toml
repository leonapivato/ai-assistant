# ADR-0349 §7:3, ADR-0353 §10:5: an input that changes two pieces of running work, on
# two of the person's origins, is meant for both: the theatre tickets and the table,
# each moved to Sunday. Re-rendered in ADR-0353's format (§13:4).
prompt = "understanding"
guards = "continuation_missed"
came_from = "2026-10-26"
set = "development"
samples = 2

[property]
check = "continues_exactly"
labels = ["R1", "R2"]

[input]
file = "continues-names-both-pieces-of-work.json"
