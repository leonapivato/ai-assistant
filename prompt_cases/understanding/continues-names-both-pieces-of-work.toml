# ADR-0349 §7:3, §10:1: an input that changes two pieces of running work, on two of the
# person's places, names both in continues: the theatre tickets and the table, each
# moved to Sunday.
prompt = "understanding"
guards = "continuation_missed"
came_from = "2026-10-26"
set = "development"
samples = 2

[flags]
recalled = false
stories = false
person = false

[property]
check = "continues_exactly"
labels = ["R1", "R2"]

[input]
file = "continues-names-both-pieces-of-work.json"
