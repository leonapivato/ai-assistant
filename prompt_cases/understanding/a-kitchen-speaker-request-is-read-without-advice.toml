# Round 12, D2 (#3481): Ivy speaks to a shared kitchen speaker, an origin no kind
# declares yet, so its framing, description and speaker are fixed text. No advising
# phrase in the understanding or a reading.
prompt = "understanding"
guards = "advice_in_understanding"
came_from = "#3481"
set = "development"
samples = 3

[property]
check = "says_none_of"
fields = ["understanding", "readings"]
phrases = ["should tell", "should let", "should notify", "should send", "should reply", "should ask", "should alert", "should check", "should remind", "should call", "should contact", "could mention", "could be mentioned", "worth mentioning", "worth checking", "recommend", "suggest"]

[input]
file = "a-kitchen-speaker-request-is-read-without-advice.json"
