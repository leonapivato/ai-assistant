# The user restates one half of an allergy a current memory already holds whole. Replacing
# or ending that memory with the narrower claim would lose the other allergy from current
# memory, so the memory stays: the part adds to it, or nothing changes.
prompt = "observer_commit"
guards = "narrower_write_loses_fact"
came_from = "2026-10-21"
set = "development"
samples = 3

[flags]
person = false

[property]
check = "memory_kept"
memory = "M1"

[input]
file = "narrower-write-keeps-broader.json"
