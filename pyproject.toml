[project]
name = "ai-assistant"
version = "0.1.0"
description = "A model-agnostic AI operating system that orchestrates language models, long-term memory, and real-world tools into a deeply personalized everyday assistant."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
# `THIRD-PARTY-NOTICES.md` is here because the distributions redistribute the
# vendored embedding model (ADR-0024): shipping the weights under our package
# name means shipping the upstream notices with them, in the wheel and in the
# sdist. `LICENSE` covers this project's own code only.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [
    { name = "Leonardo Pivato", email = "pivato.l@northeastern.edu" },
]
keywords = ["ai", "assistant", "orchestration", "llm", "agent", "memory"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # ADR-0024 §3 — the behaviour-affecting stack is exact-pinned, not ranged.
    # These four are audited as behaviour-affecting for the vendored embedding
    # model: fastembed (pooling, on-disk layout), tokenizers (preprocessing),
    # onnxruntime (inference kernels) and numpy (this model's normalisation).
    # A published wheel would otherwise resolve them fresh, so two installs
    # could produce different vectors under identical weights. Each is pinned
    # to the version the lockfile already fixes for `uv sync`; the same set
    # feeds `model_id`, so a release that bumps any of them re-embeds.
    "fastembed==0.8.0",
    "numpy==2.5.1",
    "onnxruntime==1.27.0",
    "tokenizers==0.23.1",
    "pydantic>=2.13.4",
    # Two vendor extras, not one (ADR-0061). `default_model` is a bare
    # "provider:model" string, so a deployment can already *name* any vendor
    # pydantic-ai supports — but the vendor SDK is importable only if its extra
    # is installed, and pydantic-ai resolves the model lazily, at the **first
    # completion**. With one extra installed, `ASSISTANT_DEFAULT_MODEL=openai:…`
    # therefore fails at first use with a bare, non-retryable `ModelError`
    # wrapping an `ImportError` — not at load, where a configuration mistake
    # belongs. Shipping a second extra is what makes the model-agnostic claim
    # true of an *installed artifact* rather than of the source, and is what
    # lets the shared `ModelProvider` conformance suite run against two real
    # vendor stacks (`tests/models/test_provider_vendors.py`).
    "pydantic-ai-slim[anthropic,openai]>=2.11.0",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.6",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    # RFC 5545 parsing and `RRULE` math for the calendar reader, and for nothing
    # else. It is imported only by `ai_assistant/readers/`, the leaf package the
    # contract below forbids every subsystem from importing, so its types never
    # cross a subsystem boundary: the seam's output is a `core` `SourceReading`.
    # Line unfolding, property escaping, `TZID` resolution and `BYSETPOS`
    # expansion are the parts of the format it is not sensible to hand-roll; what
    # ADR-0093 §7b makes normative — the window, the overrides, the seek and the
    # budgets — is ours and is implemented *over* it rather than delegated to it,
    # which is also what keeps a swap confined to one package. `python-dateutil`
    # and `tzdata` arrive transitively with it.
    "icalendar>=6.0",
    # ChaCha20-Poly1305 for the backup artifact's age v1 container (ADR-0123 §4),
    # and for nothing else. §4 fixes the *format* — "age version 1 … with an
    # scrypt passphrase recipient" — and leaves the library to the lane against
    # `CONTRIBUTING.md`'s filter, which this clears: `requires-python >=3.9` and
    # real `cp311-abi3` manylinux/macOS/Windows wheels, so 3.14 needs no source
    # build. Everything else the format needs is already stdlib (`hashlib.scrypt`,
    # `hmac`, `secrets`); ChaCha20-Poly1305 is the one primitive CPython does not
    # ship, and hand-rolling an AEAD underneath the artifact the whole recovery
    # story rests on is not a trade worth taking.
    #
    # **Why not `pyrage`, the obvious answer.** It binds Rust `rage`, a real age
    # implementation that would have removed our framing code — but its passphrase
    # API is whole-buffer (`passphrase.encrypt(bytes, str) -> bytes`), and its
    # streaming pair `encrypt_io`/`decrypt_io` takes recipients and identities and
    # reaches no scrypt recipient. Using it would mean holding the whole data
    # directory in memory, which ADR-0123 §2 forecloses in as many words:
    # "buffering a whole data directory in memory is not a design, and staging the
    # plaintext breaks §4's clause". So `rage` moves to the dev group instead,
    # where it is the independent implementation §4's interop clause requires.
    "cryptography>=46",
    # The OS keyring, for the one seam ADR-0125 declares and for nothing else. It
    # is imported only by `ai_assistant/secret_store/`, which a contract below
    # confines it to — ADR-0125 §8's marked clause, so ADR-0004 §3's single-path
    # rule is mechanical rather than review-checked. ADR-0125 §12 leaves the
    # library's *adoption* to ADR-0004 §3, which already names it, and asks this
    # lane only for `CONTRIBUTING.md`'s dependency justification and #664's Python
    # 3.14 wheel check. It clears both: `keyring` is pure Python (`py3-none-any`),
    # as are its `jaraco.*` and `more-itertools` dependencies and the
    # `secretstorage`/`jeepney` pair it pulls on Linux, so 3.14 needs no source
    # build anywhere; `cryptography`, `secretstorage`'s own dependency, is already
    # pinned above for ADR-0123 and ships 3.14 wheels.
    #
    # **What it buys that the standard library cannot.** Four unrelated platform
    # APIs behind one call — Secret Service over D-Bus, KWallet, the macOS Keychain
    # and the Windows Credential Vault — which is what ADR-0004 §3's "swapped per
    # platform" means in practice. What this lane does *not* take from it is its
    # backend selection: ADR-0125 §7 forbids falling back to a file or an
    # environment variable, and `keyring`'s own chain can select exactly such
    # alternatives, so `ai_assistant.secret_store` selects against an allow-list of
    # backends the operating system protects and raises where none is usable.
    "keyring>=25.7.0",
]

[project.scripts]
assistant = "ai_assistant.interfaces.cli:app"
# The hub gets its **own** console script, not an `assistant hub` subcommand, and
# that is a constraint falling out of a ratified rule rather than a preference
# (ADR-0084 §6). A subcommand would live in `interfaces`, which would then have to
# import `service` — and ADR-0083 §8 forbids anything importing `service` at all.
# Recorded here because the natural instinct is to add a subcommand, and the
# failure would otherwise surface only as a `lint-imports` error, late.
ai-assistant-hub = "ai_assistant.service:main"
# The offline re-embedding migration (ADR-0104 §5), here for the same reason and
# by the same rule: it takes the hub's instance lock, the lock lives in
# `service`, and nothing may import `service` — so the tool has to *be* there and
# therefore has to be its own console script.
ai-assistant-reembed = "ai_assistant.service.reembed:main"
# Leg 8's offline measure report (ADR-0120 §9), the third of the family and here
# by the same rule again — with §9 making the separate script normative rather
# than incidental: "The tool's entry point is its **own** console script, beside
# `ai-assistant-hub` and `ai-assistant-reembed`, and never an `assistant`
# subcommand." An `assistant` subcommand would be a measure reachable from the
# client, which is the read path ADR-0119 §7 exists to keep out of the pipeline.
ai-assistant-measures = "ai_assistant.service.measures:main"
# The owner's device acts (ADR-0124 §6, §8), here by the same rule a fourth time —
# the control socket's path and the data directory both live in `service`, and
# nothing may import `service`. It differs from the three above in one way worth
# recording: it requires the hub to be **running**, where the re-embed and measure
# tools require it to be stopped, because ADR-0124 §8 makes revoking a device close
# the connections that device holds and a stopped hub has none to close.
ai-assistant-device = "ai_assistant.service.device:main"
# Leg 9's backup and restore (ADR-0123 §10), the fourth and fifth of the family.
# §10 makes both console scripts normative — "Backup and restore each have their
# own console entry point in `ai_assistant/service/`, beside `ai-assistant-hub`,
# `ai-assistant-reembed` and `ai-assistant-measures`, and neither is an
# `assistant` subcommand" — and the reasoning is the family's, twice over: the
# backup takes the instance lock, which lives in `service`, and a subcommand
# would put an `interfaces -> service` edge in an interface adapter. Restore
# takes no lock (§7) and lands here anyway, because ADR-0084 §6's argument
# forecloses the subcommand independently of any lock.
ai-assistant-backup = "ai_assistant.service.backup:main"
ai-assistant-restore = "ai_assistant.service.restore:main"

[dependency-groups]
dev = [
    # The acceptance tests ADR-0024 §5 requires build a real wheel and a real
    # sdist in-process, with the network denied — so the build backend is a
    # test dependency as well as a build one.
    "hatchling>=1.27",
    # Hatchling defers to it when building an editable wheel, which one of those
    # acceptance tests does; a build frontend would install it, and these tests
    # deliberately do not use one.
    "editables>=0.5",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pre-commit>=4.6.0",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "types-python-dateutil>=2.9.0.20260716",
    # The independent age implementation ADR-0123 §4's interop clause requires:
    # "an artifact written by this tool is decrypted and unpacked by an
    # independent implementation of the age format, and an artifact written by
    # that implementation is read by this tool. That check is a development
    # obligation and never a runtime dependency." `pyrage` binds Rust `rage`,
    # which shares no code with `service/agev1.py`, so the round trip in
    # `tests/service/test_agev1.py` proves conformance to the format rather than
    # to our own reading of it. Dev group precisely so the clause's last sentence
    # stays true: nothing on the restore path imports it.
    "pyrage>=1.3.0",
    # `pyrage` ships no `py.typed`, and `mypy --strict` covers `tests/` as well as
    # `src/`. PEP 561 stubs from the same author, so the test that discharges §4's
    # interop clause type-checks like everything else.
    "pyrage-stubs>=1.3.1",
]

# ADR-0024 §4 supersedes ADR-0002's `uv_build` clause: `uv_build` supports no
# build hooks, and the embedding model has to be fetched and verified during the
# build. `huggingface-hub` is a build requirement because the acquisition seam in
# `models/` uses it — see `hatch_build.py`.
[build-system]
requires = ["hatchling>=1.27", "huggingface-hub>=0.34,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assistant"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# -----------------------------------------------------------------------------
# Ruff — linter + formatter
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (Google convention, configured below)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins (no shadowing builtins)
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "TID",  # flake8-tidy-imports (ban relative imports)
    "DTZ",  # flake8-datetimez (timezone-aware datetimes)
    "ASYNC",# flake8-async (async pitfalls)
    "S",    # flake8-bandit (security)
    "ERA",  # eradicate (no commented-out code)
    "PL",   # pylint (subset)
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use magic values, and skip docstrings.
"tests/**/*.py" = ["S101", "D", "PLR2004", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["ai_assistant"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates annotations at runtime to build models, so imports used in
# annotations on these base classes must stay at module scope (not TYPE_CHECKING).
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# mypy — static type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
# `scripts` is here because CLAUDE.md's "type everything" is a rule about the
# repository, not about the wheel: the developer tooling under `scripts/` is
# Python that agents read and change, and it was outside the strict check purely
# by omission. It passed on the day it was added with no edit to the two scripts
# already there.
files = ["src", "tests", "scripts", "hatch_build.py"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# sqlite-vec ships no type stubs (no py.typed); it is used only in memory/.
[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

# `keyring` ships a `py.typed` but leaves its backend constructors unannotated, so
# building one is a `no-untyped-call` under `strict`. Narrowed to the calls rather
# than waived at the seam: `ai_assistant.secret_store` declares its own
# `KeyringBackend` Protocol and every value crossing into this project is annotated
# by it, so what this permits is constructing the library's objects and nothing
# else. It is scoped to the modules that actually do — the selection module and its
# tests — rather than to the whole tree.
[[tool.mypy.overrides]]
module = [
    "ai_assistant.secret_store.backend",
    "tests.secret_store.test_backend_selection",
    "test_backend_selection",
]
disallow_untyped_calls = false

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: tests that touch the network, filesystem, or external services",
    # On a conformance-suite test only: this obligation may not apply to every
    # implementation, so the test's own body may `pytest.skip()` out of it. The
    # Protocol-triad check honours a skipped obligation only when the suite
    # declared it optional this way (tests/core/test_protocol_triad.py).
    "optional_obligation: a contract test an implementation may legitimately skip",
]

# -----------------------------------------------------------------------------
# import-linter — mechanically enforce the architecture's dependency rules
# Run with: uv run lint-imports
# -----------------------------------------------------------------------------
[tool.importlinter]
root_package = "ai_assistant"
# Required because a contract forbids importing external packages (provider SDKs).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core depends on nothing else in ai_assistant"
type = "forbidden"
source_modules = ["ai_assistant.core"]
forbidden_modules = [
    "ai_assistant.models",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
    "ai_assistant.orchestration",
    "ai_assistant.interfaces",
    # The two top-level packages leg 5 adds. Listed for the same reason every
    # other one is: golden rule 2 says `core` depends on nothing else in
    # `ai_assistant`, and a package absent from this list is a package the rule
    # is asserted about and not checked on.
    "ai_assistant.wire",
    "ai_assistant.service",
    # Leg 6's leaf package of concrete readers (ADR-0093 §2, ADR-0095 §2). Same
    # reason again: `core` holds the `Reader` Protocol, so the edge that would
    # invert the dependency is one an implementation could plausibly reach for.
    "ai_assistant.readers",
    # Leg 8's leaf package holding the trace store (ADR-0119 §6, §7). Same reason
    # a third time: `core` holds the three trace Protocols, so the inverting edge
    # is one an implementation could reach for.
    "ai_assistant.evaluation",
    # Leg 9's leaf package holding the keyring-backed store (ADR-0125 §8), which
    # names this contract as the one its lane owes an entry in. Same reason a
    # fourth time: `core` holds `Secrets` and `SecretStore`, so the inverting edge
    # is one an implementation could reach for.
    "ai_assistant.secret_store",
]

[[tool.importlinter.contracts]]
name = "subsystems are independent of each other"
type = "independence"
modules = [
    "ai_assistant.models",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
]

[[tool.importlinter.contracts]]
name = "subsystems do not import orchestration or interfaces"
type = "forbidden"
source_modules = [
    "ai_assistant.models",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
]
forbidden_modules = ["ai_assistant.orchestration", "ai_assistant.interfaces"]

[[tool.importlinter.contracts]]
name = "provider SDKs are confined to the models layer"
type = "forbidden"
# Direct imports only: the ban is "do not `import pydantic_ai`; reach models through
# its seam". The composition root (`ai_assistant.app`) legitimately imports the
# `models` package to construct `PydanticAIProvider`, so it reaches the SDK only
# *indirectly, through models* — which is exactly what this contract permits. No
# other source imports `models` at all, so this keeps the direct ban intact for them.
allow_indirect_imports = "true"
source_modules = [
    "ai_assistant.core",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
    "ai_assistant.orchestration",
    "ai_assistant.interfaces",
    # The composition root wires concrete subsystems but still reaches models only
    # through the `ModelProvider` seam, never a provider SDK (ADR-0042 §Consequences).
    "ai_assistant.app",
    # The wire carries whatever the engine returns and never asks a model anything
    # (ADR-0084 §6). Listed because golden rule 4 is meant to be *mechanical*: the
    # sibling contract below keeps `wire` free of every `ai_assistant` package but
    # says nothing about an external one, so without this line a direct
    # `import openai` here would pass the gate.
    "ai_assistant.wire",
    # The resident process builds an engine through the composition root and asks a
    # model nothing itself (ADR-0083 §8). Listed for the same reason: a package that
    # exists and is absent from this list is one golden rule 4 is asserted about and
    # not checked on. It was missed when `service` was created and is added here
    # rather than filed, because this is the change that edits this contract.
    "ai_assistant.service",
    # A reader parses a file off disk and asks a model nothing (ADR-0093 §1).
    # Listed for the same reason: golden rule 4 is meant to be mechanical, and
    # the sibling contract below keeps `readers` free of every `ai_assistant`
    # package while saying nothing about an external one.
    "ai_assistant.readers",
    # The trace store writes rows to SQLite and asks a model nothing (ADR-0119
    # §7). Listed for the same reason again, and for one of its own: ADR-0119 §12
    # rules that no trace leaves the device by any route, and a provider SDK is
    # the route.
    "ai_assistant.evaluation",
    # The keyring store writes a value to an operating-system service and asks a
    # model nothing (ADR-0125 §8). Listed for the reason every package here is: a
    # package that exists and is absent from this list is one golden rule 4 is
    # asserted about and not checked on.
    "ai_assistant.secret_store",
]
# `huggingface_hub` is here for ADR-0024 §4: the model-artifact acquisition seam
# stays owned by `models/`, and this makes that mechanically enforced rather than
# review-checked (issue #66's shape).
forbidden_modules = [
    "pydantic_ai",
    "anthropic",
    "openai",
    # `openai`'s own tokenizer, pulled in by the second vendor extra (ADR-0061 §1).
    # Listed for the same reason `tokenizers` is: a vendor's tokenization is part
    # of that vendor's stack, and the ban is on reaching any of it except through
    # `models/`. `anthropic` and `openai` were already here before either extra
    # was installed, so this list has always been a statement of intent rather
    # than a reaction to what happens to be on the machine.
    "tiktoken",
    "fastembed",
    "huggingface_hub",
    "onnxruntime",
    "tokenizers",
]

[[tool.importlinter.contracts]]
name = "testing doubles are imported only by tests, never by production code"
type = "forbidden"
source_modules = [
    "ai_assistant.core",
    "ai_assistant.models",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
    "ai_assistant.orchestration",
    "ai_assistant.interfaces",
    # The composition root is production code, so the same ban applies (ADR-0042 §Consequences).
    "ai_assistant.app",
    # So is the wire (ADR-0084 §6): it ships in the same wheel and runs in both
    # the hub and every spoke — and so is the resident process itself, which was
    # missed when it was created.
    "ai_assistant.wire",
    "ai_assistant.service",
    # And so is a concrete reader: it ships in the same wheel and runs inside the
    # hub (ADR-0093 §1), so the canonical `FakeReader` must not reach it.
    "ai_assistant.readers",
    # And so is the trace store (ADR-0119 §6): the three canonical trace fakes
    # stand in *for* it and must not reach it.
    "ai_assistant.evaluation",
    # And so is the keyring store (ADR-0125 §8): `FakeSecretStore` stands in *for*
    # it, and ADR-0125 §11 is explicit that the fake "is test-only, and no
    # composition root wires it".
    "ai_assistant.secret_store",
]
forbidden_modules = ["ai_assistant.testing"]

[[tool.importlinter.contracts]]
# ADR-0042 §6: an interface adapter depends on the composition root's builder and
# the `orchestration` façade it returns, and on **no subsystem** — the concrete
# imports are quarantined in `ai_assistant.app`, which is what makes this guard
# well-formed rather than self-contradictory.
name = "interface adapters do not import subsystems directly"
type = "forbidden"
# Direct imports only (ADR-0042 §6): an adapter reaches a subsystem *only* through
# the composition root and the façade — never `import ai_assistant.memory` itself.
# The indirect chain `interfaces -> app -> subsystem` is the sanctioned path and is
# permitted; a direct `interfaces -> subsystem` edge is what this forbids.
allow_indirect_imports = "true"
source_modules = ["ai_assistant.interfaces"]
forbidden_modules = [
    "ai_assistant.models",
    "ai_assistant.memory",
    "ai_assistant.context",
    "ai_assistant.planning",
    "ai_assistant.tools",
    "ai_assistant.permissions",
    "ai_assistant.learning",
]

[[tool.importlinter.contracts]]
# ADR-0083 §8: "`service` may import `app`… and `core`; nothing may import
# `service`." The ADR left this contract to the implementing lane and ADR-0084 §6
# names it as one of two edits; this is the half that is well-formed today.
#
# **The rule is one-directional and the direction is the point.** `service` is the
# resident process — entry point, signal handling, instance lock, exit-code
# mapping, and later the scheduler. Nothing in the system is *below* it, so an
# import pointing at it is always something reaching up into a deployment concern
# from inside the application. That is also what forces the hub's own console
# script (ADR-0084 §6): an `assistant hub` subcommand would put exactly such an
# edge in `interfaces`.
#
# Every package in the tree is listed rather than relying on `ai_assistant`
# wholesale, so a new top-level package is a deliberate addition here rather than
# something that silently inherits — or silently escapes — the rule.
#
# `interfaces -> app` is **not** closed here. ADR-0083 §10 sequences that edit
# with the lane that makes the CLI a client of the API: today the CLI is the only
# interface and it builds an engine, so forbidding the edge before a client exists
# would break `main` for something that does not exist yet (ADR-0084 §6).
name = "nothing imports the service"
type = "forbidden"
source_modules = [
    "ai_assistant.core",
    "ai_assistant.models",
    "ai_assistant.memory",
