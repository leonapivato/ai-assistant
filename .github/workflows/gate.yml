name: gate

# SPIKE (do not merge): measure the gate's test step split across parallel jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2, 3, 4]
        index: [0, 1, 2, 3]
        exclude:
          - {split: 1, index: 1}
          - {split: 1, index: 2}
          - {split: 1, index: 3}
          - {split: 2, index: 2}
          - {split: 2, index: 3}
          - {split: 3, index: 3}
    name: tests n${{ matrix.split }} i${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Install the browser
        run: uv run playwright install --with-deps chromium
      - name: Tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest -n auto --basetemp=/tmp/pt
          --shard-index ${{ matrix.index }} --shard-count ${{ matrix.split }}
          --junitxml=junit.xml -o junit_family=xunit2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-n${{ matrix.split }}-i${{ matrix.index }}
          path: junit.xml

  gate:
    if: always()
    needs: [static, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.tests.result }}" = success
