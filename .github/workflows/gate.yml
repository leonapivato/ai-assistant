name: gate

# The Definition-of-Done gate (CONTRIBUTING, "The gate"), run remotely so a
# passing PR means the gate passed on neutral ground — not just on the author's
# machine. Ratified in ADR-0010.
#
# Since ADR-0310 it runs as parallel jobs: the four static steps in one job, the
# test step split across several, and one job named `gate` that passes only when
# every other job passed. `gate` is the check branch protection requires
# (ADR-0167 §1:1); no other job carries that name. Since ADR-0326 §7 one more job
# runs beside them, `upgrade`, and `gate` requires it like the others.

on:
  # The default pull_request set, named so that nothing is added by accident.
  # Marking a draft ready runs nothing (ADR-0288 §1): no job has a draft
  # condition, so the run on the head's own push is already the one the merger
  # reads, and a run on the flip would test identical content.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The four static steps, in the local gate's order, in a job of their own that
  # runs beside the tests (ADR-0310 §4). Their order holds within this job; a
  # static failure no longer withholds the test verdict, and both arrive on one
  # push.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --locked

      # No `just` here: it was installed only for the tests that drove the
      # justfile end to end (test_workspace.py's
      # test_just_claim_workspace_recipe_*), and ADR-0015 removed those along
      # with the recipes they covered. Nothing in the suite shells out to
      # `just` now — the gate steps call `uv run` directly, same as the local
      # gate. Dropping it also drops a dependency on the GitHub releases API,
      # whose 503 failed this workflow on its first run.

      # `--check` makes the formatter report drift instead of rewriting files.
      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Architecture boundaries
        run: uv run lint-imports

      # Not a gate step: Tier 2 never fails a change (ADR-0088 §3), and Tier 1
      # already runs inside the test jobs' `Tests`. This publishes the standing
      # Tier 2 list — unresolved code citations and liveness disagreements — to
      # the run's summary page, which is the answer to §Consequences' "Tier 2
      # needs someone to read it. A report nobody reads is worse than no report,
      # because it looks like coverage." `--report-only` keeps a Tier 1 finding
      # from failing this step twice. `always()`, as before the split: it reports
      # whether or not the static steps above passed.
      - name: ADR citation report (Tier 2, advisory)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/check_citations.py \
            --report-only --summary "$GITHUB_STEP_SUMMARY"

  # The test step, split across parallel jobs over one partition of the suite
  # (ADR-0310 §1). Every job collects the whole suite and keeps the share
  # `tests/suite_partition.py` assigns its index; every item of the
  # Protocol-triad's evidence is in share 0, where both triad checks are decided
  # (§2). The shares' union is the suite, and each item runs in exactly one job.
  #
  # The index and the count come from the matrix's own `strategy.job-index` and
  # `strategy.job-total`, so every index the partition can assign is a job this
  # workflow runs (§1:3): the count is the length of `share`, and the values in it
  # are labels only. Three jobs is ADR-0310's measured recommendation; changing
  # the count owes no ADR (§1:5), but it does weigh against the account's runner
  # concurrency, which is in that ADR's Consequences.
  #
  # `fail-fast: false`, so one failing share does not cancel the others' verdicts.
  tests:
    name: tests (share ${{ strategy.job-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        share: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --locked

      # An environment-preparation step and not a gate step (ADR-0216 §5): it
      # asserts nothing, and it can fail only as an environment failure.
      #
      # **Unconditional, in every test job** (ADR-0310 §3:2). The partition
      # divides the gateway's browser layer among the jobs, one browser per job
      # holding a share, so every job may run some of it — and none may take
      # ADR-0216 §6:1's local skip. The full `chromium` rather than the headless
      # shell, because §5 defaults to the expensive build until a recorded
      # comparison over this layer's cases licenses the other one. `--with-deps`
      # because a bare runner has none of the shared libraries the build links
      # against, and a browser that will not start is a failure, not a skip.
      - name: Install the browser the gateway's page layer drives
        run: uv run playwright install --with-deps chromium

      - name: Tests
        # `GH_TOKEN` is here for one test: ADR-0088 §6's Tier 1 includes "a
        # tracker citation naming an issue number that does not exist", and
        # `tests/scripts/test_adr_citations_corpus.py` can only ask GitHub that
        # question with a token. Without one the checker treats the citations as
        # unevaluable and passes them silently (§6), and the test skips — so this
        # is what makes half of Tier 1 actually run, rather than what makes it
        # pass. It is the workflow's own read-only token; nothing here writes.
        #
        # `-n auto` distributes this job's share across the runner's cores (four,
        # on `ubuntu-latest` for a public repository). Since ADR-0179 the triad
        # check aggregates every worker's record on the controller, so share 0
        # decides both checks over its own whole session (ADR-0310 §2:2); no job
        # carries any part of that record to another.
        #
        # The partition is the only selection (ADR-0310 §1:3). A partitioned run
        # that anything else narrows — `-k`, `-m`, `--deselect`, a path — is
        # refused before it collects, so nothing that narrows it may be added to
        # this line.
        #
        # `--partition-manifest` records the whole collection and its assignment
        # for `gate` to compare across jobs (§1:4). It is a list of names and not
        # triad evidence.
        #
        # `--basetemp` is the same 108-byte `sun_path` margin the `test-fast`
        # recipe explains at length: xdist adds a `popen-gwN/` component, and
        # the default root (`/tmp/pytest-of-runner/pytest-N/`) leaves the
        # suite's worst AF_UNIX path within a byte or two of the budget. A short
        # root buys the margin back. A fixed name is safe here where it is not
        # locally: the runner is a fresh VM with exactly one run on it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest -n auto --basetemp=/tmp/pt
          --partition-index ${{ strategy.job-index }}
          --partition-count ${{ strategy.job-total }}
          --partition-manifest "$RUNNER_TEMP/collection.json"

      # Read by `gate`'s collection check. `overwrite`, so re-running a failed
      # job replaces its record rather than failing on the name.
      - name: Keep this job's collection for gate
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ strategy.job-index }}
          path: ${{ runner.temp }}/collection.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # ADR-0326 §7's upgrade check: the build at the base writes a data directory
  # through every store a person's hub keeps, and the build at the head opens it
  # and reads every record back (`scripts/upgrade_check.py`). It is required by
  # being one of `gate`'s parts, so no branch-protection setting names it.
  #
  # The head is this run's checkout: on a pull request the merge commit, which is
  # the head's content once the branch is up to date with its base, as branch
  # protection requires before a merge. The base is the commit the pull request
  # merges onto (§2:4), or on a push to `main` the commit `main` held before it.
  # The script checks the base out into a worktree with its own locked
  # environment, so the base's code writes and the head's reads. Only that one
  # commit is fetched; a worktree of it needs no history.
  upgrade:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Fetch the base
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: The head opens what the base wrote
        run: uv run python scripts/upgrade_check.py run --base "$BASE"

  # The required check (ADR-0167 §1:1), and the only job named `gate`
  # (ADR-0310 §5). It needs every other job of this workflow and runs whatever
  # their outcome, because GitHub counts a *skipped* required check as passing:
  # with an ordinary `needs`, a failed part would skip `gate` and the merge path
  # would read it as green. It passes only when each part concluded `success`, so
  # a part that failed, was cancelled or was skipped fails it.
  gate:
    needs: [static, tests, upgrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `needs` as a whole, rather than one line per job, so that a job added to
      # `needs` is judged without a second edit here. A matrix job's result is
      # `success` only when every one of its jobs succeeded.
      - name: Every part concluded success
        env:
          PARTS: ${{ toJSON(needs) }}
        run: |
          echo "$PARTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$PARTS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Gather every test job's collection
        uses: actions/download-artifact@v4
        with:
          pattern: collection-*
          path: ${{ runner.temp }}/collections

      # ADR-0310 §1:4: every test job's whole collection is the same set of node
      # ids, and `gate` fails where two differ. An item whose id differed between
      # jobs could hash to another job in each and run in none, which no single
      # job can see. The script also checks that there is one record per index
      # and that every job computed the same assignment. Stdlib only, so it runs
      # on the pinned interpreter without syncing the project.
      - name: Every test job collected the same suite
        run: >-
          uv run --no-project python scripts/check_partition_collections.py
          "$RUNNER_TEMP/collections"
