name: gate

# The Definition-of-Done gate (CONTRIBUTING, "The gate"), run remotely so a
# passing PR means the gate passed on neutral ground — not just on the author's
# machine. Ratified in ADR-0010.

on:
  # `ready_for_review` is explicit so marking a draft PR ready re-runs the gate —
  # which is what lets the codex-review workflow (ADR-0012) fire on that
  # transition via workflow_run. The other three are the default pull_request set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --locked

      # No `just` here: it was installed only for the tests that drove the
      # justfile end to end (test_workspace.py's
      # test_just_claim_workspace_recipe_*), and ADR-0015 removed those along
      # with the recipes they covered. Nothing in the suite shells out to
      # `just` now — the gate steps below call `uv run` directly, same as the
      # local gate. Dropping it also drops a dependency on the GitHub releases
      # API, whose 503 failed this workflow on its first run.

      # The five gate steps, in the same order as the local gate. `--check`
      # makes the formatter report drift instead of rewriting files in CI.
      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: Tests
        # `GH_TOKEN` is here for one test: ADR-0088 §6's Tier 1 includes "a
        # tracker citation naming an issue number that does not exist", and
        # `tests/scripts/test_adr_citations_corpus.py` can only ask GitHub that
        # question with a token. Without one the checker treats the citations as
        # unevaluable and passes them silently (§6), and the test skips — so this
        # is what makes half of Tier 1 actually run, rather than what makes it
        # pass. It is the workflow's own read-only token; nothing here writes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run pytest

      # Not a sixth gate step: Tier 2 never fails a change (ADR-0088 §3), and
      # Tier 1 already runs inside `Tests` above. This publishes the standing
      # Tier 2 list — unresolved code citations and liveness disagreements — to
      # the run's summary page, which is the answer to §Consequences' "Tier 2
      # needs someone to read it. A report nobody reads is worse than no report,
      # because it looks like coverage." `--report-only` keeps a Tier 1 finding
      # from failing this step twice.
      - name: ADR citation report (Tier 2, advisory)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/check_citations.py \
            --report-only --summary "$GITHUB_STEP_SUMMARY"
