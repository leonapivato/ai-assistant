name: container

# Builds the image for one person's hub and its gateway (#3142) and drives it end to
# end: readiness on a fresh volume, the gateway answering on the published port, the
# admin acts through exec, a restart carrying the data, and the deployment faults
# exiting 78. Beside it, `deploy` proves the deploy path (#3160) by deploying one person
# to the runner itself under the shipped systemd unit: a first install killed outright and
# run again (#3185), an upgrade that backs up and carries the data, a failed backup that
# leaves the earlier image running, and the unit restarting a crash and leaving a 78 down.
# Neither the development machine nor the box has a container runtime; GitHub's runners
# do, so this is where both are proven.
#
# **Not part of `gate`**, deliberately. `gate` is the one check branch protection
# requires (ADR-0167 §1:1), and neither of this workflow's jobs is named `gate` or is
# among the jobs `gate.yml`'s `gate` requires, so they report beside the gate and never
# block a merge. They cost wheel and image builds, so they run only where what they
# prove can have moved: the image's own files, the deploy script and the module it
# imports, this workflow, and the two files the image's dependency set is built from.
# A change elsewhere that breaks either is caught by the weekly run on `main`, and by
# any run started by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "deploy/container/**"
      - ".github/workflows/container.yml"
      - "tests/deploy/**"
      - "scripts/deploy_container.py"
      - "scripts/deploy_hub.py"
      - "tests/scripts/test_deploy_container.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "deploy/container/**"
      - ".github/workflows/container.yml"
      - "scripts/deploy_container.py"
      - "scripts/deploy_hub.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      # The supervisor's own tests and its static checks. `gate` runs the tests too;
      # mypy here because `[tool.mypy].files` does not reach `deploy/`.
      - name: Supervisor checks
        run: |
          uv sync --locked
          uv run ruff format --check deploy/container
          uv run ruff check deploy/container
          uv run mypy --strict deploy/container/supervise.py deploy/container/smoke.py
          uv run pytest tests/deploy -p no:cacheprovider

      - name: Build the image
        run: deploy/container/build.sh ai-assistant-hub:ci

      - name: Smoke test
        run: uv run --no-project --with cryptography python deploy/container/smoke.py ai-assistant-hub:ci

  # The deploy path on a runner, which has Docker, a running systemd and passwordless
  # sudo: the runner is the box, `deploy_container.py --local` its operator's command.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      # `gate` runs these tests too; mypy here because `[tool.mypy].files` does not
      # reach `deploy/`.
      - name: Deploy checks
        run: |
          uv sync --locked
          uv run mypy --strict deploy/container/deploy_smoke.py
          uv run pytest tests/scripts/test_deploy_container.py tests/deploy/test_container_unit.py -p no:cacheprovider

      - name: Deploy to this runner
        run: uv run --no-project --with cryptography python deploy/container/deploy_smoke.py
