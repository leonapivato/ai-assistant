<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The container's session bus, for its keyring and nothing else (#3142).

  The distribution's session.conf with one thing taken out: its service directories.
  With them, the first client to ask for the Secret Service before the keyring has
  registered would have the bus start a second gnome-keyring-daemon, one nobody
  unlocked, and the two would race for the name. Here a name only exists once its
  owner has registered it, so supervise.py's wait for the keyring waits for the one
  it started. supervise.py passes the same address as an argument, which is what a
  test outside the image moves.
-->
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/assistant/bus</listen>
  <keep_umask/>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
